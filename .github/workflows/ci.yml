name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-api:
    name: Typecheck @doohub/api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dohuub_claude/doohub-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace dependencies
        run: npm install --include=optional --legacy-peer-deps

      # The api imports from '@doohub/database' and '@doohub/shared' which
      # both resolve to ./dist/*.js + *.d.ts via their package.json `main`/`types`.
      # Those files don't exist until each workspace package is built. The
      # database build also runs prisma generate to produce the client types.
      - name: Build @doohub/database
        run: npm run build --workspace=@doohub/database

      - name: Build @doohub/shared
        run: npm run build --workspace=@doohub/shared

      - name: Typecheck
        run: npm run typecheck --workspace=@doohub/api

  typecheck-portal:
    name: Typecheck @doohub/portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dohuub_claude/doohub-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace dependencies
        run: npm install --include=optional --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck --workspace=@doohub/portal
